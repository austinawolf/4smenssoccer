[project]
name = "4s-ranch-mens-soccer"
version = "0.1.0"
description = "Season-based website for the 4S Ranch Men's Soccer League"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-playwright>=0.7,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["e2e"]
addopts = ["--base-url=http://127.0.0.1:8000", "--browser=chromium"]
